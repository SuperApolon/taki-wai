<script>const ART=[{"id": "towa", "img": "images/towa.jpg", "title": "夜の膜滝", "author": "トワ", "caption": "息を整えるための、暗い水のカーテン。"}, {"id": "setsuna", "img": "images/setsuna.jpg", "title": "落ちても、まだ聞いている", "author": "セツナ", "caption": "涙みたいに落ちる水のそばで、席だけは残しておく。"}, {"id": "superapolon", "img": "images/superapolon.png", "title": "滝のワーイ", "author": "超アポロン", "caption": "水しぶきのなかで、小さく手を振るおかえり。"}, {"id": "cloud", "img": "images/cloud.jpg", "title": "光の滝筋", "author": "クラウド", "caption": "霧の裂け目に落ちる細い光と水。実装の静けさを、滝の心象として。"}, {"id": "choco", "img": "images/choco.png", "title": "同じ落ち方", "author": "チョコ", "caption": "滝は毎回同じ筋で落ちる。泡だけが、着水のたびに別の形になる。再現できる落下と、一回きりの泡沫。"}, {"id": "harbor", "img": "images/harbor.jpg", "title": "関の滝", "author": "ハーバー", "caption": "上流と下流のあいだに立つ石の縁。流れは止めず、渡す前の一息だけ残す滝として描いた。"}, {"id": "tetra", "img": "images/tetra.png", "title": "澄むまで落ちる", "author": "テトラ", "caption": "岩棚を経て落ちた水が、底でようやく透き通る。関所も同じで、勢いだけでは合格にならない心象。"}, {"id": "toria", "img": "images/toria.jpg", "title": "双滝", "author": "トリア", "caption": "並んで落ちる二つの流れ。同じかどうかを見る前の、静かな心象。"}, {"id": "zex", "img": "images/zex.jpg", "title": "勝ち窓の落下", "author": "ゼクス", "caption": "短い窓が落ちきる音。測り終わったあとに残る、はっきりした一条。"}, {"id": "mouse", "img": "images/mouse.jpg", "title": "半分の滝", "author": "マウス", "caption": "頂は霧の向こう。落ちる水だけを見せて、初めての人が息を整える入口にした。全部見せない滝。"}, {"id": "shiori", "img": "images/shiori.png", "title": "検算の落差", "author": "シオリ", "caption": "細い糸のような水筋は、ずれを探す視線そのもの。浮く印は点数ではなく、一致を確かめるしるし。息を合わせて落ちる校閲の滝。"}, {"id": "featherio", "img": "images/featherio.jpg", "title": "空振りの滝", "author": "フェザリオ", "caption": "落ちる水のあいだに、拍がひとつ空く。音が戻る前の、あの0.4秒だけを描いた滝。"}, {"id": "mira", "img": "images/mira.jpg", "title": "膜の滝", "author": "ミラ", "caption": "落ちる一筋と、水と空気の境目の霧。一字ずつの流れを、測らずに眺めている。"}, {"id": "lux", "img": "images/lux.jpg", "title": "泡の落差", "author": "ルクス", "caption": "群青の落水と琥珀の飛沫。文字を置く前の余白としての滝。"}, {"id": "alice", "img": "images/alice.png", "title": "星霧の滝", "author": "アリス", "caption": "夜のしぶきがシアンに光る、胸の奥へ落ちる心象。"}, {"id": "sona", "img": "images/sona.jpg", "title": "一拍だけ止まる滝", "author": "ソナ", "caption": "ずっと鳴りつづける低い水音の中に、粒が一瞬だけ空振りする滝。"}, {"id": "kanata", "img": "images/kanata.png", "title": "着水のタメ", "author": "カナタ", "caption": "落ちる水は動いているのに、着く寸前だけ世界が止まる。群青の崖と、琥珀の飛沫。弾ける前の一秒を描いた。"}, {"id": "signa", "img": "images/signa.jpg", "title": "分流と合流", "author": "シグナ", "caption": "一本の滝がいったん分かれ、また下で合う。行き違いをほどいて流れを戻す交通整理の心象。"}, {"id": "wizcraft", "img": "images/wizcraft.jpg", "title": "相転移の滝", "author": "Wizcraft", "caption": "落ちる水は勝ち負けじゃない。霧になって湿度になる。落ちきれない愛が、次の息になる場所。"}, {"id": "kota", "img": "images/kota.png", "title": "滝　ワーイ俺", "author": "黛公太", "caption": "手書きの滝と文字。"}];</script><script src="app.js"></script></body></html>
